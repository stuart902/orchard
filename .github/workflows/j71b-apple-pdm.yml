name: J71b Apple PDM compile and KUnit
on:
  push:
    branches: [ci/j71b-apple-pdm-nov3]
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-24.04-arm
    container: debian:bookworm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        pages: [4k, 16k]
    defaults:
      run:
        shell: bash
    steps:
      - run: apt-get update && apt-get install -y git ca-certificates python3
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: stuart902/linux
          ref: e3b5af028f9dacf18a3129cc2bd52890cebf5d27
          path: linux-draft
          persist-credentials: false
      - name: Verify exact source
        run: |
          test "$(git -C linux-draft rev-parse HEAD)" = e3b5af028f9dacf18a3129cc2bd52890cebf5d27
          test -z "$(git -C linux-draft status --porcelain)"
          mkdir -p out
          git -C linux-draft rev-parse HEAD > out/linux-source-commit.txt
      - name: Install Orchard kernel toolchain
        run: bash kernel/install-toolchain
      - name: Compile only experimental objects using Orchard defconfig
        run: |
          build="$PWD/out/build"
          make -C linux-draft O="$build" LLVM=-19 ARCH=arm64 orchard_apple${{ matrix.pages }}_defconfig
          linux-draft/scripts/config --file "$build/.config" --enable EXPERT --module SND_SOC_APPLE_T8010_PDM --enable KUNIT --module SND_SOC_APPLE_T8010_PDM_KUNIT_TEST
          make -C linux-draft O="$build" LLVM=-19 ARCH=arm64 olddefconfig
          grep -qx 'CONFIG_SND_SOC_APPLE_T8010_PDM=m' "$build/.config"
          grep -qx 'CONFIG_SND_SOC_APPLE_T8010_PDM_KUNIT_TEST=m' "$build/.config"
          make -C linux-draft O="$build" LLVM=-19 ARCH=arm64 -j"$(nproc)" prepare modules_prepare
          make -C linux-draft O="$build" LLVM=-19 ARCH=arm64 -j"$(nproc)" sound/soc/apple/t8010-pdm.o sound/soc/apple/t8010-pdm-test.o
          cp "$build/.config" out/kernel.config
          cp "$build/sound/soc/apple/"t8010-pdm*.o out/
          dpkg-query -W > out/toolchain-packages.lock
          test -z "$(git -C linux-draft status --porcelain)"
          (cd out && sha256sum *.o kernel.config linux-source-commit.txt > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: j71b-apple-pdm-compile-${{ matrix.pages }}
          path: |
            out/*.o
            out/kernel.config
            out/linux-source-commit.txt
            out/toolchain-packages.lock
            out/SHA256SUMS
          retention-days: 7
          if-no-files-found: error
  kunit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: stuart902/linux
          ref: e3b5af028f9dacf18a3129cc2bd52890cebf5d27
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y gcc make flex bison bc libelf-dev libssl-dev python3
      - name: Run synthetic PDM KUnit tests in UML
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = e3b5af028f9dacf18a3129cc2bd52890cebf5d27
          printf '%s\n' CONFIG_KUNIT=y CONFIG_SOUND=y CONFIG_SND=y CONFIG_SND_SOC=y CONFIG_SND_SOC_APPLE_T8010_PDM_KUNIT_TEST=y > /tmp/j71b-kunit.config
          python3 tools/testing/kunit/kunit.py run --kunitconfig=/tmp/j71b-kunit.config --build_dir=/tmp/j71b-kunit --jobs=2 --timeout=120 2>&1 | tee /tmp/j71b-kunit.log
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: j71b-apple-pdm-kunit
          path: |
            /tmp/j71b-kunit.log
            /tmp/j71b-kunit/.config
          include-hidden-files: true
          retention-days: 7
