name: SmartIO transfer length checks
on:
  push:
    branches: [ci/sio-transfer-length-nov3]
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-24.04-arm
    container: debian:bookworm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        pages: [4k, 16k]
    defaults:
      run:
        shell: bash
    steps:
      - run: apt-get update && apt-get install -y git ca-certificates python3
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: stuart902/linux
          ref: 6bc9e5febc9880a8230b2dd7c8f8e1a07e7607a2
          path: linux-draft
          persist-credentials: false
      - name: Verify pinned source
        run: |
          test "$(git -C linux-draft rev-parse HEAD)" = 6bc9e5febc9880a8230b2dd7c8f8e1a07e7607a2
          test -z "$(git -C linux-draft status --porcelain)"
          mkdir -p out
          git -C linux-draft rev-parse HEAD > out/linux-source-commit.txt
      - name: Install Orchard kernel toolchain
        run: bash kernel/install-toolchain
      - name: Compile SmartIO core and DMA consumer
        run: |
          build="$PWD/out/build"
          make -C linux-draft O="$build" LLVM=-19 ARCH=arm64 orchard_apple${{ matrix.pages }}_defconfig
          make -C linux-draft O="$build" LLVM=-19 ARCH=arm64 -j"$(nproc)" prepare modules_prepare
          make -C linux-draft O="$build" LLVM=-19 ARCH=arm64 -j"$(nproc)" drivers/soc/apple/apple-sio-core.o drivers/dma/apple-sio-dma.o
          cp "$build/.config" out/kernel.config
          cp "$build/drivers/soc/apple/apple-sio-core.o" "$build/drivers/dma/apple-sio-dma.o" out/
          dpkg-query -W > out/toolchain-packages.lock
          test -z "$(git -C linux-draft status --porcelain)"
          (cd out && sha256sum *.o kernel.config linux-source-commit.txt > SHA256SUMS)
      - name: Exercise completion byte counts
        env:
          CC: cc -fsanitize=address,undefined -fno-omit-frame-pointer
        run: python3 ci/test_sio_transfer_length.py linux-draft
      - uses: actions/upload-artifact@v4
        with:
          name: sio-length-6bc9e5f-compile-${{ matrix.pages }}
          path: |
            out/*.o
            out/kernel.config
            out/linux-source-commit.txt
            out/toolchain-packages.lock
            out/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
