name: J71b SPDX regression checks (no release)
on:
  workflow_dispatch:
  push:
    branches: [test/j71b-poweroff-ci-nov3]
permissions:
  contents: read
env:
  KERNEL_SHA: 9fcc0ed563f59392e8834b0691cd21b51dc45242
  BASELINE_SHA: 778174c50d5fd6b36849f9eea728a6811b1b6e9e
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          repository: stuart902/linux
          ref: 9fcc0ed563f59392e8834b0691cd21b51dc45242
          fetch-depth: 2
          persist-credentials: false
      - name: Verify exact source and comment-only change
        run: |
          test "$(git rev-parse HEAD)" = "$KERNEL_SHA"
          python3 - <<'PY'
          import ast, os, pathlib, subprocess
          path = 'tools/testing/selftests/d2365/test_poweroff.py'
          baseline = subprocess.check_output(
              ['git', 'show', os.environ['BASELINE_SHA'] + ':' + path], text=True)
          current = pathlib.Path(path).read_text()
          added = '# SPDX-License-Identifier: GPL-2.0-only\n'
          assert current.splitlines()[1] == added.rstrip('\n')
          assert current.replace(added, '', 1) == baseline
          assert ast.dump(ast.parse(current)) == ast.dump(ast.parse(baseline))
          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', os.environ['BASELINE_SHA'], 'HEAD'],
              text=True).splitlines()
          assert changed == [path], changed
          print('Exact SPDX-only diff; Python AST and all production files unchanged.')
          PY
      - name: Run source-tree selftests
        run: make -C tools/testing/selftests/d2365 run_tests
      - name: Run installed selftests and missing-source skip
        run: |
          install="$RUNNER_TEMP/d2365-spdx-installed"
          make -C tools/testing/selftests/d2365 install INSTALL_PATH="$install"
          mapfile -t runners < <(find "$install" -name test_poweroff.py)
          test "${#runners[@]}" = 1
          D2365_KERNEL_SRC="$PWD" python3 "${runners[0]}" -v
          set +e
          env -u D2365_KERNEL_SRC python3 "${runners[0]}"
          status=$?
          set -e
          test "$status" = 4
      - name: Check the new patch excluding human DCO
        run: |
          git show --format=email "$KERNEL_SHA" | ./scripts/checkpatch.pl --no-signoff -
