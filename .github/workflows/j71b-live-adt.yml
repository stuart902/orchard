name: J71b native live ADT compile and tests
on:
  push:
    branches: [ci/j71b-live-adt-nov3]
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-24.04-arm
    container: debian:bookworm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        pages: [4k, 16k]
    defaults:
      run:
        shell: bash
    steps:
      - run: apt-get update && apt-get install -y git ca-certificates python3 python3-venv python3-dev swig libyaml-dev device-tree-compiler
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: stuart902/linux
          ref: 0b870bb1436dab073fde50989bd82cbe29dfd723
          path: linux-draft
          persist-credentials: false
      - name: Verify exact source
        run: |
          test "$(git -C linux-draft rev-parse HEAD)" = 0b870bb1436dab073fde50989bd82cbe29dfd723
          test -z "$(git -C linux-draft status --porcelain)"
          mkdir -p out
          git -C linux-draft rev-parse HEAD > out/linux-source-commit.txt
      - name: Install Orchard kernel toolchain
        run: bash kernel/install-toolchain
      - name: Compile only experimental objects using Orchard defconfig
        run: |
          build="$PWD/out/build"
          make -C linux-draft O="$build" LLVM=-19 ARCH=arm64 orchard_apple${{ matrix.pages }}_defconfig
          linux-draft/scripts/config --file "$build/.config" --enable EXPERT --enable MTD --enable MTD_PHRAM --module SND_SOC_APPLE_T8010_PDM --module APPLE_SIO_DMA --module APPLE_SIO --module SND_SOC_APPLE_T8010_PDM_KUNIT_TEST --module APPLE_AOP_AUDIO --module APPLE_AOP_T8010 --module APPLE_AOP_ACCEL --enable KUNIT --module APPLE_AOP_AUDIO_KUNIT_TEST
          make -C linux-draft O="$build" LLVM=-19 ARCH=arm64 olddefconfig
          grep -qx 'CONFIG_SND_SOC_APPLE_T8010_PDM=m' "$build/.config"
          grep -qx 'CONFIG_APPLE_AOP_AUDIO=m' "$build/.config"
          grep -qx 'CONFIG_APPLE_AOP_T8010=m' "$build/.config"
          grep -qx 'CONFIG_APPLE_AOP_AUDIO_KUNIT_TEST=m' "$build/.config"
          make -C linux-draft O="$build" LLVM=-19 ARCH=arm64 -j"$(nproc)" prepare modules_prepare
          make -C linux-draft O="$build" LLVM=-19 ARCH=arm64 -j"$(nproc)" drivers/soc/apple/aop.o drivers/soc/apple/aop-audio.o drivers/soc/apple/aop-audio-test.o drivers/iio/accel/apple_aop_accel.o sound/soc/apple/t8010-pdm.o sound/soc/apple/t8010-pdm-test.o drivers/dma/apple-sio-dma.o drivers/soc/apple/apple-sio-core.o
          cp "$build/.config" out/kernel.config
          cp "$build/drivers/soc/apple/aop-audio.o" "$build/drivers/soc/apple/aop.o" "$build/drivers/soc/apple/aop-audio-test.o" "$build/drivers/iio/accel/apple_aop_accel.o" "$build/sound/soc/apple/t8010-pdm.o" "$build/sound/soc/apple/t8010-pdm-test.o" "$build/drivers/dma/apple-sio-dma.o" "$build/drivers/soc/apple/apple-sio-core.o" out/
          dpkg-query -W > out/toolchain-packages.lock
          test -z "$(git -C linux-draft status --porcelain)"
          (cd out && sha256sum *.o kernel.config linux-source-commit.txt > SHA256SUMS)
      - name: Validate disabled J71b device tree
        if: matrix.pages == '16k'
        run: |
          python3 -m venv /tmp/pdm-schema
          /tmp/pdm-schema/bin/pip install dtschema
          export PATH="/tmp/pdm-schema/bin:$PATH"
          build="$PWD/out/build"
          schemas="sound/apple,t8010-pdm.yaml:sound/simple-card.yaml:sound/dmic-codec.yaml:soc/apple/apple,t8010-aop.yaml"
          make -C linux-draft O="$build" LLVM=-19 ARCH=arm64 DT_SCHEMA_FILES="$schemas" dt_binding_check
          make -C linux-draft O="$build" LLVM=-19 ARCH=arm64 CHECK_DTBS=y DT_SCHEMA_FILES="$schemas" apple/t8010-j71b.dtb 2>&1 | tee out/dtb-validation.log
          dtb="$build/arch/arm64/boot/dts/apple/t8010-j71b.dtb"
          for node in /dmic /microphones /soc/pdm@20a0b4000 /soc/aop@210800000/aop-audio; do
            test "$(fdtget "$dtb" "$node" status)" = disabled
          done
          test "$(fdtget "$dtb" /soc/pdm@20a0b4000 compatible)" = apple,j71b-pdm
          test "$(fdtget "$dtb" /sound simple-audio-card,name)" = "J71b Speakers"
          dt-validate -s "$build/Documentation/devicetree/bindings/processed-schema.json" -l 'apple,t8010-pdm:simple-card:dmic-codec:apple,t8010-aop' "$dtb" 2>out/audio-schema-errors.log
          test ! -s out/audio-schema-errors.log
          cp "$dtb" out/
          /tmp/pdm-schema/bin/pip freeze > out/schema-packages.lock
          (cd out && sha256sum t8010-j71b.dtb >> SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: j71b-live-adt-compile-${{ matrix.pages }}
          path: |
            out/*.o
            out/kernel.config
            out/linux-source-commit.txt
            out/toolchain-packages.lock
            out/SHA256SUMS
            out/*.dtb
            out/*log
            out/schema-packages.lock
          retention-days: 7
          if-no-files-found: error
  kunit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: stuart902/linux
          ref: 0b870bb1436dab073fde50989bd82cbe29dfd723
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y gcc make flex bison bc libelf-dev libssl-dev python3
      - name: Run audio property KUnit tests in UML
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = 0b870bb1436dab073fde50989bd82cbe29dfd723
          printf '%s\n' CONFIG_KUNIT=y CONFIG_COMPILE_TEST=y CONFIG_EXPERT=y CONFIG_NO_IOMEM=n CONFIG_SOUND=y CONFIG_SND=y CONFIG_SND_SOC=y CONFIG_APPLE_AOP_AUDIO_KUNIT_TEST=y CONFIG_SND_SOC_APPLE_T8010_PDM_KUNIT_TEST=y > /tmp/j71b-kunit.config
          python3 tools/testing/kunit/kunit.py run --kunitconfig=/tmp/j71b-kunit.config --build_dir=/tmp/j71b-kunit --jobs=2 --timeout=120 2>&1 | tee /tmp/j71b-kunit.log
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: j71b-live-adt-kunit
          path: |
            /tmp/j71b-kunit.log
            /tmp/j71b-kunit/.config
          include-hidden-files: true
          retention-days: 7
  bindings:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: stuart902/linux
          ref: 0b870bb1436dab073fde50989bd82cbe29dfd723
          persist-credentials: false
      - name: Install schema tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-dev swig device-tree-compiler libyaml-dev
          python3 -m venv /tmp/aop-schema
          /tmp/aop-schema/bin/pip install dtschema
          /tmp/aop-schema/bin/pip freeze > /tmp/aop-schema-packages.lock
      - name: Validate AOP service binding
        run: /tmp/aop-schema/bin/dt-doc-validate Documentation/devicetree/bindings/soc/apple/apple,t8010-aop.yaml Documentation/devicetree/bindings/sound/apple,t8010-pdm.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: j71b-live-adt-schema-toolchain
          path: /tmp/aop-schema-packages.lock
          retention-days: 7
  lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: stuart902/linux
          ref: 0b870bb1436dab073fde50989bd82cbe29dfd723
          path: linux-draft
          persist-credentials: false
      - name: Run extracted PDM lifecycle and native calibration tests
        run: |
          test "$(git -C linux-draft rev-parse HEAD)" = 0b870bb1436dab073fde50989bd82cbe29dfd723
          python3 ci/test-pdm-power-order.py linux-draft/sound/soc/apple/t8010-pdm.c
          python3 ci/test-pdm-prepare-order.py linux-draft/sound/soc/apple/t8010-pdm.c
          mkdir -p /tmp/pdm-live-adt/tests
          cp -R ci/pdm-live-adt-tests/. /tmp/pdm-live-adt/tests/
          cp linux-draft/sound/soc/apple/t8010-pdm.c linux-draft/sound/soc/apple/t8010-pdm.h linux-draft/sound/soc/apple/t8010-pdm-adt.h /tmp/pdm-live-adt/
          python3 /tmp/pdm-live-adt/tests/test_live_adt.py
          python3 /tmp/pdm-live-adt/tests/test_snapshot.py
          test -z "$(git -C linux-draft status --porcelain)"
