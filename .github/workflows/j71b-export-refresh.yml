name: J71b documented export refresh
on:
  push:
    branches: [test/j71b-export-refresh-20261104]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare documented export tools
        run: |
          df -h "$PWD"
          python -c 'import shutil; assert shutil.disk_usage(".").free >= 10 * 1024**3'
          sudo apt-get update
          sudo apt-get install -y podman gcc
      - name: Regenerate, export and test the source
        run: python ci/j71b-refresh-export.py
      - uses: actions/upload-artifact@v4
        with:
          name: j71b-documented-export
          path: out/j71b-export
          if-no-files-found: error
          retention-days: 7
