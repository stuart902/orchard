# iPad 7 (Wi-Fi) — J171: hardware identity, boot assets and firmware recipe.
schema = 1
kind = "hardware.device"

[device]
profile = "j171"
name = "iPad 7 (Wi-Fi)"
apple_products = ["iPad7,11"]
dt_compatible = ["apple,j171"]

# BDID: ApBoardID/ApChipID of the j171ap identities in the 22H384 (iPadOS 18.7.11) BuildManifest.plist;
# cross-checked with api.ipsw.me/v4/device/iPad7,11 ("bdid").
[match.dfu]
chip = 0x8010
board = 0x1c

# Orchard Recovery runs here (USB "Orchard Recovery", serial BOARD:<profile>).
[match.linux]
recovery = true

[boot]
methods = ["checkm8-pongo"]
# Not published yet: no j171 launcher release exists. Mirrors the j71b URL pattern.

[kernel]
platform = "apple-16k" # kernel/series/apple-16k, kernel/configs/apple-16k
dtb = "t8010-j171"     # arch/arm64/boot/dts/apple/<dtb>.dtb

[firmware]
recipe = "firmware.json" # Relative to this device.toml; public recipe, not firmware bytes.

[support]
install = true
status = "experimental"
caveats = [
  "Bluetooth needs its module vendor (Murata or USI) chosen per unit; it works once the matching patch file is selected by hand (#49).",
  "Wi-Fi and SmartIO firmware come from iPadOS 17.7, not the 18.x build tested so far; Wi-Fi works with it on hardware (#35), SmartIO is not checked.",
  "Charging is limited to 500 mA from any source until source identification and unplug withdrawal exist (README.md).",
]
wifi = true # Connects with the 17.7 firmware on a J171 (#35). DT board-type is apple,rudderb, the ADT says "ruddera".
usb_serial = false # No Orchard launcher/gadget validated on this board yet.
usb_network = false

# States: working, partial, untested, missing, none (features.toml).
# Measured on one J171 with Omarchy A 0.2.0 installed (#35); buttons on the 0.1.11 build.
[features]
display = "working"
touch = "working"
wifi = "working"
bluetooth = "partial"
storage = "working"
battery = "working"
charging = "partial"
backlight = "working"
buttons = "working"
audio = "missing"
camera = "missing"
cellular = "none"
suspend = "untested"
gpu = "missing"
